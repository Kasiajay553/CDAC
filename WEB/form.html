<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Appointment Form</title>
</head>
<body>
    <form action="#" method="POST">
        <label for="patientName">Patient Name:</label><br>
        <input type="text" id="patientName" name="patientName" required><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob" required><br><br>

        <label for="mobile">Mobile Number:</label><br>
        <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" placeholder="10-digit number" required><br><br>

        <label for="bloodGroup">Blood Group:</label><br>
        <input type="text" id="bloodGroup" name="bloodGroup" placeholder="e.g., O+" required><br><br>

        <label for="appDate">Appointment Date:</label><br>
        <input type="date" id="appDate" name="appDate" required><br><br>

        <label for="appTime">Time:</label><br>
        <input type="time" id="appTime" name="appTime" required><br><br>

        <button type="submit">Submit Details</button>
    </form>
</body>
</html>
