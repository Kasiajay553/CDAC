<form action="#" method="post">
    <label for="full name">Full Name : </label>
    <input type="text" id="full name"  placeholder="enter name" required> <br>
    <label for="email" >Email:</label>
    <input type="email" id="email" ><br>

    <label for="phonenumber">Phone :</label>
    <input type="tel" id="phonenumber" ><br>

    <label for="dateofbirth">Date of Birth : </label>
    <input type="date" id="dateofbirth"><br>

  
    <label for="course">Select Course:</label><br>
    <select id="course" name="selectedCourse">
    <option selected>-- Choose a course --</option>
    <option value="java">Java</option>
    <option value="python">Python</option>
    <option value="cpp">C++</option>
    <option value="mysql">MySQL</option>
    </select><br>

    <label>Gender</label>
    <input type="radio" id="malegender" name="gender" value="male">
    <label for="gender">Male</label>
    <input type="radio" id="femalegender" name="gender" value="female">
    <label for="gender">Female</label><br>

    <label for="skills">Skills:</label>
    <input type="checkbox"  id="skills">
    <label>java</label>
    <input type="checkbox" id="skills">
    <label>C++</label>
    <input type="checkbox" id="skills">
    <label>python</label>
    <input type="checkbox" id="skills">
    <label>Mysql</label><br>

    <label for="file">Add Resume</label>
    <input type="file" id="file"><br>

    <label for="password">Password</label>
    <input type="password" id="password"><br>

    <input type="checkbox"  required>
    <label>I Agree</label><br>

    <button>Submit</button>
</form>
